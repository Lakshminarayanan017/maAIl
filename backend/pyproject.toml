[project]
name = "maail-backend"
version = "0.1.0"
description = "Maail — thread-first email intelligence. Backend."
requires-python = ">=3.10"

dependencies = [
  "fastapi>=0.115,<0.120",
  "uvicorn[standard]>=0.32,<0.36",
  "sqlalchemy[asyncio]>=2.0.36,<2.1",
  "asyncpg>=0.30,<0.31",
  "greenlet>=3.1",
  "alembic>=1.14,<1.17",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "structlog>=24.4",
  # Agent manifests are YAML in Git: procedural memory, read at deploy.
  "pyyaml>=6.0,<7",
  # HTML sanitiser for sender-controlled markup (gap D3). Rust ammonia
  # bindings rather than a hand-rolled filter: this is a parser-
  # differential problem, not a regex problem.
  "nh3>=0.2.18,<0.4",
  # AES-GCM for envelope encryption of provider credentials (gap D8).
  "cryptography>=43.0,<47",
  # The OAuth token exchange and, from phase 2, the Gmail client.
  "httpx>=0.28,<0.29",
  # Not optional and not Windows-only. Relative-date resolution happens in the
  # user's timezone, so the tz database is a correctness dependency; shipping it
  # means a deadline resolves the same way on every host.
  "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
  # pytest 9.2.0 crashes at collection with pytest-asyncio 1.4 (NodeId
  # _str_cache AttributeError), so both are pinned to the pairing that works.
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<0.26",
  "ruff>=0.8",
  "mypy>=1.13,<2",
  "types-PyYAML>=6.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

# ---------------------------------------------------------------------------
# Lint and format. One tool, so `check.sh` has one thing to keep working.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
  "E", "W",    # pycodestyle
  "F",         # pyflakes
  "I",         # import sorting
  "UP",        # pyupgrade
  "B",         # bugbear
  "ASYNC",     # async correctness
  "S",         # bandit — security
  "T20",       # no print()
  "RUF",
]
ignore = [
  "S101",      # assert is how pytest works
  "B008",      # FastAPI Depends() in defaults is the documented idiom
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]
"app/core/config.py" = ["S104"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
plugins = []
strict = true
warn_unreachable = true
disallow_untyped_decorators = false
exclude = ["migrations/versions/"]

[[tool.mypy.overrides]]
module = ["alembic.*", "asyncpg.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning"]
markers = [
  "arch: architecture boundary checks — no database, no network",
  "security: tenancy, authorisation and injection checks",
  "integration: needs a running Postgres",
]
